# ESB split transport (peripheral, pipe 1)
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
# Previously implied by BLE: battery level (reported to the dongle over ESB)
# and the hardware RNG (used by the nice!view widget)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ENTROPY_GENERATOR=y
# Trackball motion is bursty; deeper TX FIFO avoids dropping events at source
CONFIG_ESB_TX_FIFO_SIZE=16

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_PMW3610=y
CONFIG_PMW3610_PM=y
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_MOVEMENT_THRESHOLD=5
CONFIG_PMW3610_JITTER_FILTER_THRESHOLD=4
CONFIG_PMW3610_JITTER_FILTER_TIMEOUT_MS=80
CONFIG_PMW3610_POLLING_RATE_250=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y
