# Connect to whichever paired dongle is powered (home dock dongle / travel dongle).
# BT_MAX_PAIRED = number of dongles to remember; pairing a further one replaces the oldest.
CONFIG_ZMK_SPLIT_BLE_ANY_CENTRAL=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
